name: Weekly Movie Link Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 5"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: weekly-movie-link-check
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify project
        run: pnpm verify

      - name: Confirm Discord secret is configured
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Add DISCORD_WEBHOOK_URL in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check movie links and post to Discord
        run: >-
          pnpm check --
          --discord
          --concurrency 1
          --timeout 30
          --request-delay 3000
          --request-jitter 1000
          --retry-rate-limits
          --settle 750
